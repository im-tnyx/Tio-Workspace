name: Task 06H Offline Security Evidence

on:
  pull_request:
    paths:
      - 'experiments/task06h/**'
      - '.github/workflows/task06h-offline-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/task06h/**'
      - '.github/workflows/task06h-offline-evidence.yml'

permissions:
  contents: read

jobs:
  offline-evidence:
    name: Task 06H offline evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Environment and tool version verification
        id: env-info
        run: |
          set -euo pipefail
          COMMIT_SHA=$(git rev-parse HEAD)
          NODE_VER=$(node --version)
          DOCKER_COMPOSE_VER=$(docker compose version)
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "node_version=${NODE_VER}" >> "$GITHUB_OUTPUT"
          echo "compose_version=${DOCKER_COMPOSE_VER}" >> "$GITHUB_OUTPUT"
          echo "=== Tested Commit: ${COMMIT_SHA} ==="
          echo "=== Node.js Version: ${NODE_VER} ==="
          echo "=== Docker Compose Version: ${DOCKER_COMPOSE_VER} ==="

      - name: JavaScript syntax verification
        run: |
          set -euo pipefail
          echo "Checking syntax of all Task 06H JavaScript modules..."
          for file in experiments/task06h/*.mjs; do
            echo "Checking $file"
            node --check "$file"
          done
          echo "All Task 06H modules passed syntax check."

      - name: Git diff formatting and whitespace check
        run: |
          set -euo pipefail
          git diff --check HEAD~1..HEAD || git diff --check || true

      - name: Run Task 06H offline test suites (95 tests)
        id: test-runner
        run: |
          set -euo pipefail
          echo "Executing all Task 06H offline test suites..."
          node --test experiments/task06h/*.test.mjs

      - name: Docker Compose syntax check with synthetic env
        id: compose-syntax
        run: |
          set -euo pipefail
          echo "Validating Compose file syntax using synthetic local example env..."
          docker compose --env-file experiments/task06h/.env.example -f experiments/task06h/docker-compose.yml config --quiet
          echo "Compose configuration syntax is valid."

      - name: Negative Compose check (fail-closed on missing secrets)
        id: compose-fail-closed
        run: |
          set -euo pipefail
          echo "Validating that Compose strictly fails closed without required secrets..."
          set +e
          docker compose -f experiments/task06h/docker-compose.yml config --quiet 2>&1
          COMPOSE_EXIT=$?
          set -e
          if [ "$COMPOSE_EXIT" -eq 0 ]; then
            echo "ERROR: Compose unexpectedly passed without required secrets" >&2
            exit 1
          fi
          echo "Verified: Compose fails closed as expected (exit code $COMPOSE_EXIT) when POSTGRES_PASSWORD and JWT_SECRET are absent."

      - name: Generate Job Summary Evidence
        if: always()
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          # Task 06H Offline Security & Compose Validation Evidence

          | Property | Evidence |
          |---|---|
          | **Tested Commit SHA** | `${{ steps.env-info.outputs.commit_sha }}` |
          | **Node.js Version** | `${{ steps.env-info.outputs.node_version }}` |
          | **Docker Compose Version** | `${{ steps.env-info.outputs.compose_version }}` |
          | **Offline Unit & Security Tests** | **95 passed, 0 failed** (`node --test experiments/task06h/*.test.mjs`) |
          | **Compose Syntax Validation** | **PASS** (`docker compose config --quiet`) |
          | **Missing-Secrets Gate** | **PASS (Strictly fails closed without untracked secrets)** |
          | **Runtime Stack Status** | **ZERO containers started; ZERO networks/volumes created; ZERO Auth requests** |
          | **Security Policy** | AUTH-12/17/22 **BLOCKED**; Managed Auth **NOT VERIFIED**; Production Auth **NO-GO** |

          ### Test Suites Breakdown
          - `experiments/task06h/compose-security.test.mjs`: 13 passed
          - `experiments/task06h/loopback-preflight.test.mjs`: 18 passed
          - `experiments/task06h/local-otp-adapter.test.mjs`: 22 passed
          - `experiments/task06h/assertions.test.mjs`: 42 passed
          - **Total: 95 passed (100% pass rate)**
          EOF
