name: Phase 1.1 shell checks

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'eslint.config.cjs'
      - 'scripts/**'
      - '.github/workflows/phase1-shell.yml'
      - '.github/workflows/expo-pr-preview.yml'
      - '.github/scripts/*expo*preview*'
      - '.github/scripts/check-expo-live-pr.sh'
      - '.github/scripts/start-preview-codespace.sh'
      - '.github/scripts/verify-expo-live-pr.mjs'
      - '.github/preview-eas-cli/**'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'eslint.config.cjs'
      - 'scripts/**'
      - '.github/workflows/phase1-shell.yml'
      - '.github/workflows/expo-pr-preview.yml'
      - '.github/scripts/*expo*preview*'
      - '.github/scripts/check-expo-live-pr.sh'
      - '.github/scripts/start-preview-codespace.sh'
      - '.github/scripts/verify-expo-live-pr.mjs'
      - '.github/preview-eas-cli/**'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Design guard compares with immutable historical baseline
          persist-credentials: false
      - name: Fetch immutable design-token baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            fetch --no-tags origin b8e0250f5b7973b5798399d40fb67b1aa241dcbf
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify Expo SDK package compatibility
        run: npm run expo:check
      - name: Verify design token checker self-tests
        run: npm run tokens:self-test
      - name: Fail on newly hardcoded color and size tokens
        run: npm run tokens:check
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Pure shell contract tests
        run: npm test
      - name: Verify Expo preview policy
        run: |
          node --test tests/expo-live-preview.test.mjs tests/expo-preview-recovery.test.mjs
          bash -n .github/scripts/check-expo-live-pr.sh
          bash -n .github/scripts/start-preview-codespace.sh
          bash -n .github/scripts/sync-expo-pr-live-preview.sh
