name: TNYX labeled PR Expo Go preview

# workflow_run uses the default branch. Manual dispatch is restricted to main.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open owner-authored PR labeled tnyx-preview
        required: true
        type: string
      head_sha:
        description: Full 40-character PR head SHA approved for this preview
        required: true
        type: string
  workflow_run:
    workflows:
      - TNYX PR preview push signal
    types:
      - completed

permissions:
  contents: read
  pull-requests: read # Read the PR and its immutable base/head metadata.
  issues: read # Enumerate open PRs with the preview label.

concurrency:
  group: tnyx-labeled-pr-expo-preview
  cancel-in-progress: false

jobs:
  select:
    name: Verify preview eligibility
    if: >-
      github.repository == 'im-tnyx/Tio-Workspace' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == '1' &&
      (
        (github.event_name == 'workflow_dispatch' &&
         github.actor == 'im-tnyx' &&
         github.triggering_actor == 'im-tnyx') ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.run_attempt == 1 &&
         github.event.workflow_run.path == '.github/workflows/expo-pr-live-push-signal.yml' &&
         github.event.workflow_run.head_repository.full_name == 'im-tnyx/Tio-Workspace' &&
         github.event.workflow_run.actor.login == 'im-tnyx' &&
         github.event.workflow_run.triggering_actor.login == 'im-tnyx' &&
         github.event.workflow_run.head_branch != 'main' &&
         github.event.workflow_run.head_branch != 'tnyx/expo-preview')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Select and validate an immutable labeled PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_PR: ${{ inputs.pr_number }}
          PREVIEW_SHA: ${{ inputs.head_sha || github.event.workflow_run.head_sha }}
          PUSH_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            [[ -n "$PUSH_BRANCH" && "$PREVIEW_SHA" =~ ^[0-9a-f]{40}$ ]]
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
              --jq '.[] | select(.head.sha == env.PREVIEW_SHA and .head.ref == env.PUSH_BRANCH and
                .head.repo.full_name == env.GITHUB_REPOSITORY and .base.ref == "main" and
                any(.labels[]?; .name == "tnyx-preview")) | .number' > "$RUNNER_TEMP/preview-prs.txt"
            mapfile -t matched < "$RUNNER_TEMP/preview-prs.txt"
            if [[ "${#matched[@]}" -eq 0 ]]; then
              echo 'No eligible labeled PR at the owner push SHA.'
              exit 0
            fi
            test "${#matched[@]}" -eq 1
            export SELECTED_PR="${matched[0]}"
          fi
          bash .github/scripts/check-expo-live-pr.sh
          # Environments can be auto-created without protections. Check the
          # required deployment policy before scheduling a protected job.
          env_api="https://api.github.com/repos/$GITHUB_REPOSITORY/environments/tnyx-expo-pr-preview-trusted"
          curl -fsS --max-time 20 "$env_api" | jq -e '
            .deployment_branch_policy.custom_branch_policies == true and
            .deployment_branch_policy.protected_branches == false' >/dev/null
          curl -fsS --max-time 20 "$env_api/deployment-branch-policies?per_page=100" | jq -e '
            .total_count == 1 and (.branch_policies | length) == 1 and
            .branch_policies[0].type == "branch" and .branch_policies[0].name == "main"' >/dev/null
          {
            echo "pr_number=$SELECTED_PR"
            echo "head_sha=$PREVIEW_SHA"
          } >> "$GITHUB_OUTPUT"

  codespaces_live:
    name: Sync the dedicated preview Codespace
    needs: select
    if: needs.select.outputs.pr_number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: tnyx-expo-pr-preview-trusted
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Revalidate before accessing Codespaces
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_PR: ${{ needs.select.outputs.pr_number }}
          PREVIEW_SHA: ${{ needs.select.outputs.head_sha }}
          PUSH_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: bash .github/scripts/check-expo-live-pr.sh

      - name: Validate exact dedicated Codespace and wake if stopped
        id: codespace
        env:
          GH_TOKEN: ${{ secrets.PR_PREVIEW_CODESPACES_TOKEN }}
          CODESPACE_NAME: ${{ vars.TNYX_PR_CODESPACE_NAME }}
          CODESPACE_ID: ${{ vars.TNYX_PR_CODESPACE_ID }}
        run: |
          set -euo pipefail
          [[ -n "$GH_TOKEN" && "$CODESPACE_NAME" =~ ^[a-z0-9-]+$ && "$CODESPACE_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo '::error::Configure the dedicated Codespace ID, name and environment token.'
            exit 1
          }
          read_state() {
            gh api "/user/codespaces/$CODESPACE_NAME" | jq -er --arg name "$CODESPACE_NAME" --arg id "$CODESPACE_ID" '
              select(.name == $name and (.id | tostring) == $id and
                .display_name == "TNYX PR Preview Only" and
                .repository.full_name == "im-tnyx/Tio-Workspace" and .owner.login == "im-tnyx") | .state'
          }
          state="$(read_state)"
          echo "Initial Codespace state: $state"
          case "$state" in
            Shutdown) gh api --method POST "/user/codespaces/$CODESPACE_NAME/start" >/dev/null ;;
            Available|Starting) ;;
            *) echo '::error::Dedicated Codespace is in an unexpected state.'; exit 1 ;;
          esac
          for attempt in $(seq 1 120); do
            state="$(read_state)"
            if [[ "$state" == "Available" ]]; then
              echo "name=$CODESPACE_NAME" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$state" == "Deleted" || "$state" == "Failed" ]]; then exit 1; fi
            sleep 5
          done
          echo '::error::Dedicated Codespace did not become Available.'
          exit 1

      - name: Revalidate immediately before remote execution
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_PR: ${{ needs.select.outputs.pr_number }}
          PREVIEW_SHA: ${{ needs.select.outputs.head_sha }}
          PUSH_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: bash .github/scripts/check-expo-live-pr.sh

      - name: Sync exact verified source into the dedicated Codespace
        env:
          GH_TOKEN: ${{ secrets.PR_PREVIEW_CODESPACES_TOKEN }}
          CODESPACE_NAME: ${{ steps.codespace.outputs.name }}
          VERIFIED_SHA: ${{ needs.select.outputs.head_sha }}
        run: |
          set -euo pipefail
          [[ "$VERIFIED_SHA" =~ ^[0-9a-f]{40}$ && "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh codespace ssh --codespace "$CODESPACE_NAME" -- \
            bash -s -- "$VERIFIED_SHA" "$GITHUB_SHA" < .github/scripts/sync-expo-pr-live-preview.sh
