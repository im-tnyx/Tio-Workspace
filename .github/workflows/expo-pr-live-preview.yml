name: TNYX labeled PR Expo Go preview

# This privileged workflow is loaded from trusted main. It never checks out
# PR-authored workflow code or executes PR scripts on the Actions runner.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open owner-authored PR with the tnyx-preview label
        required: true
        type: string
  workflow_run:
    workflows:
      - TNYX PR preview push signal
    types:
      - completed

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: tnyx-labeled-pr-expo-preview
  cancel-in-progress: false

jobs:
  select:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      (
        (github.event_name == 'workflow_dispatch' &&
         github.actor == 'im-tnyx' &&
         github.triggering_actor == 'im-tnyx') ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_repository.full_name == 'im-tnyx/Tio-Workspace' &&
         github.event.workflow_run.actor.login == 'im-tnyx' &&
         github.event.workflow_run.head_branch != 'main')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      selected: ${{ steps.pr.outputs.selected }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      head_branch: ${{ steps.pr.outputs.head_branch }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Select labeled PR and verify immutable changed paths
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr_number }}
          PUSH_SHA: ${{ github.event.workflow_run.head_sha }}
          PUSH_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ ! "$INPUT_PR" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::PR number must be a positive integer string"
              exit 1
            fi
            selected="$INPUT_PR"
          else
            if [[ ! "$PUSH_SHA" =~ ^[0-9a-f]{40}$ || ! "$PUSH_BRANCH" =~ ^[a-zA-Z0-9._/-]+$ ]]; then
              echo "::error::Untrusted push metadata"
              exit 1
            fi
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
              --jq '.[] | select(.head.sha == env.PUSH_SHA and .head.ref == env.PUSH_BRANCH and .base.ref == "main") | .number' \
              > "$RUNNER_TEMP/matched-prs.txt"
            mapfile -t matched < "$RUNNER_TEMP/matched-prs.txt"
            if [[ "${#matched[@]}" -eq 0 ]]; then
              echo "No open main-targeting PR at this push SHA; skipping"
              echo 'selected=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "${#matched[@]}" -ne 1 ]]; then
              echo "::error::Ambiguous branch-to-PR mapping"
              exit 1
            fi
            selected="${matched[0]}"
          fi

          gh api "repos/$GITHUB_REPOSITORY/pulls/$selected" > "$RUNNER_TEMP/pr.json"
          head_sha="$(jq -r '.head.sha' "$RUNNER_TEMP/pr.json")"
          base_sha="$(jq -r '.base.sha' "$RUNNER_TEMP/pr.json")"
          if [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ || ! "$base_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid PR commit identity"
            exit 1
          fi

          gh api "repos/$GITHUB_REPOSITORY/compare/${base_sha}...${head_sha}" > "$RUNNER_TEMP/compare.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&labels=tnyx-preview&per_page=100" \
            --jq '.[] | select(.pull_request != null) | .number' > "$RUNNER_TEMP/labeled.txt"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$selected" > "$RUNNER_TEMP/latest-pr.json"
          SELECTED_PR="$selected" EXPECTED_PUSH_SHA="$PUSH_SHA" EXPECTED_PUSH_BRANCH="$PUSH_BRANCH" \
            node .github/scripts/verify-expo-live-pr.mjs \
            "$RUNNER_TEMP/pr.json" "$RUNNER_TEMP/latest-pr.json" \
            "$RUNNER_TEMP/compare.json" "$RUNNER_TEMP/labeled.txt"

          {
            echo 'selected=true'
            echo "pr_number=$selected"
            echo "head_sha=$head_sha"
            echo "base_sha=$base_sha"
            echo "head_branch=$(jq -r '.head.ref' "$RUNNER_TEMP/pr.json")"
          } >> "$GITHUB_OUTPUT"

  codespaces_live:
    needs: select
    if: needs.select.outputs.selected == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: tnyx-expo-pr-preview-trusted
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Revalidate selected PR before accessing Codespaces
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_PR: ${{ needs.select.outputs.pr_number }}
          EXPECTED_PUSH_SHA: ${{ needs.select.outputs.head_sha }}
          EXPECTED_PUSH_BRANCH: ${{ needs.select.outputs.head_branch }}
          EXPECTED_BASE_SHA: ${{ needs.select.outputs.base_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$SELECTED_PR" > "$RUNNER_TEMP/pr.json"
          test "$(jq -r '.base.sha' "$RUNNER_TEMP/pr.json")" = "$EXPECTED_BASE_SHA"
          gh api "repos/$GITHUB_REPOSITORY/compare/${EXPECTED_BASE_SHA}...${EXPECTED_PUSH_SHA}" > "$RUNNER_TEMP/compare.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&labels=tnyx-preview&per_page=100" \
            --jq '.[] | select(.pull_request != null) | .number' > "$RUNNER_TEMP/labeled.txt"
          cp "$RUNNER_TEMP/pr.json" "$RUNNER_TEMP/latest-pr.json"
          node .github/scripts/verify-expo-live-pr.mjs \
            "$RUNNER_TEMP/pr.json" "$RUNNER_TEMP/latest-pr.json" \
            "$RUNNER_TEMP/compare.json" "$RUNNER_TEMP/labeled.txt"

      - name: Validate exact dedicated Codespace and wake if stopped
        id: codespace
        env:
          GH_TOKEN: ${{ secrets.CODESPACES_TOKEN }}
          CODESPACE_NAME: ${{ vars.TNYX_PR_CODESPACE_NAME }}
          CODESPACE_ID: ${{ vars.TNYX_PR_CODESPACE_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" || ! "$CODESPACE_NAME" =~ ^[a-z0-9-]+$ || ! "$CODESPACE_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Configure a dedicated Codespace, immutable numeric ID and environment-scoped token"
            exit 1
          fi
          verify_identity() {
            gh api "/user/codespaces/$CODESPACE_NAME" > "$RUNNER_TEMP/codespace.json"
            jq -e --arg name "$CODESPACE_NAME" --arg id "$CODESPACE_ID" \
              '.name == $name and (.id | tostring) == $id and
               .display_name == "TNYX PR Preview Only" and
               .repository.full_name == "im-tnyx/Tio-Workspace" and
               .owner.login == "im-tnyx"' "$RUNNER_TEMP/codespace.json" >/dev/null
          }
          verify_identity
          state="$(jq -r '.state' "$RUNNER_TEMP/codespace.json")"
          if [[ "$state" == "Deleted" ]]; then
            echo "::error::Selected preview Codespace has been deleted"
            exit 1
          fi
          if [[ "$state" != "Available" ]]; then
            gh api --method POST "/user/codespaces/$CODESPACE_NAME/start" >/dev/null
          fi
          ready=false
          for attempt in $(seq 1 120); do
            verify_identity
            state="$(jq -r '.state' "$RUNNER_TEMP/codespace.json")"
            if [[ "$state" == "Available" ]]; then ready=true; break; fi
            if [[ "$state" == "Deleted" ]]; then exit 1; fi
            sleep 5
          done
          if [[ "$ready" != true ]]; then
            echo "::error::Dedicated preview Codespace did not become Available"
            exit 1
          fi
          echo "name=$CODESPACE_NAME" >> "$GITHUB_OUTPUT"

      - name: Recheck immutable PR identity immediately before remote execution
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_PR: ${{ needs.select.outputs.pr_number }}
          HEAD_SHA: ${{ needs.select.outputs.head_sha }}
          BASE_SHA: ${{ needs.select.outputs.base_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$SELECTED_PR" > "$RUNNER_TEMP/current-pr.json"
          jq -e --arg head "$HEAD_SHA" --arg base "$BASE_SHA" \
            '.state == "open" and .head.sha == $head and .base.sha == $base and
             .head.repo.full_name == "im-tnyx/Tio-Workspace" and
             any(.labels[]?; .name == "tnyx-preview")' \
            "$RUNNER_TEMP/current-pr.json" >/dev/null
          current_count="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&labels=tnyx-preview&per_page=100" \
            --jq '.[] | select(.pull_request != null) | .number' | awk 'END { print NR }')"
          test "$current_count" = 1

      - name: Sync exact verified PR source into isolated Expo Go Codespace
        env:
          GH_TOKEN: ${{ secrets.CODESPACES_TOKEN }}
          CODESPACE_NAME: ${{ steps.codespace.outputs.name }}
          VERIFIED_SHA: ${{ needs.select.outputs.head_sha }}
        run: |
          set -euo pipefail
          test "$VERIFIED_SHA" != ""
          gh codespace ssh --codespace "$CODESPACE_NAME" -- \
            bash -s -- "$VERIFIED_SHA" < .github/scripts/sync-expo-pr-live-preview.sh
