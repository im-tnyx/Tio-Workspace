# ONE-TIME lockfile blob generation for owner-authorized Phase 1.1.
# This action runs ONLY on a named same-repository branch push and creates
# a Git data blob, not a branch commit. Remove after lockfile is committed.
name: One-off Phase 1.1 lockfile Git blob
on:
  push:
    branches:
      - feat/phase1-1-expo-shell-20261114
    paths:
      - package.json
      - tsconfig.json
      - .github/workflows/lockfile-blob-once.yml

permissions:
  contents: write

jobs:
  blob:
    if: github.repository == 'im-tnyx/Tio-Workspace' && github.ref == 'refs/heads/feat/phase1-1-expo-shell-20261114'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate deterministic npm lockfile
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Create Git blob only (does not push a branch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (lock.lockfileVersion !== 3 || lock.packages[''].dependencies['react-native'] !== '0.88.1' || lock.packages[''].dependencies['react-dom'] !== '19.3.0') {
            throw new Error('Wrong lockfile contents');
          }
          fs.writeFileSync('blob-body.json', JSON.stringify({
            content: fs.readFileSync('package-lock.json', 'utf8'),
            encoding: 'utf-8',
          }));
          NODE
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -X POST --data-binary @blob-body.json \
            "https://api.github.com/repos/im-tnyx/Tio-Workspace/git/blobs" > blob-response.json
          node -e "const x=require('./blob-response.json'); if(!/^[0-9a-f]{40}$/.test(x.sha)) throw Error(JSON.stringify(x)); console.log('LOCKFILE_BLOB_SHA='+x.sha);"
