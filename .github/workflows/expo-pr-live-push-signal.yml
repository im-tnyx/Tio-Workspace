name: TNYX PR preview push signal

# Unprivileged signal only. Never checkout pushed code or expose secrets here.
on:
  push:
    branches:
      - '**'
      - '!main'
      - '!tnyx/expo-preview'

permissions:
  contents: read

concurrency:
  group: expo-pr-preview-signal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signal:
    name: Record owner push candidate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record candidate preview push
        run: echo "Candidate preview push $GITHUB_SHA (validation is delegated to trusted main)"
