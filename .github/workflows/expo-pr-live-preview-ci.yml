name: TNYX Expo PR preview policy tests

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/expo-pr-live-*.yml'
      - '.github/scripts/*expo*live*'
      - 'tests/expo-live-preview.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/expo-pr-live-*.yml'
      - '.github/scripts/*expo*live*'
      - 'tests/expo-live-preview.test.mjs'

permissions:
  contents: read

jobs:
  preview-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run immutable PR and label negative tests
        run: node --test tests/expo-live-preview.test.mjs
      - name: Check trusted Node and SSH script syntax
        run: |
          node --check .github/scripts/verify-expo-live-pr.mjs
          bash -n .github/scripts/sync-expo-pr-live-preview.sh
