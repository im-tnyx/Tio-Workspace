_format_version: "2.1"
_transform: true

services:
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1
        strip_path: true
        paths:
          - /auth/v1/
          - /auth/v1

  - name: templates
    url: http://localhost:8001/
    routes:
      - name: template-confirmation
        hosts:
          - kong
          - kong:8000
        paths:
          - /templates/confirmation.html
        plugins:
          - name: request-termination
            config:
              status_code: 200
              content_type: "text/html; charset=utf-8"
              body: "<p>Your local Tio verification code: {{ .Token }}</p>"
      - name: template-recovery
        hosts:
          - kong
          - kong:8000
        paths:
          - /templates/recovery.html
        plugins:
          - name: request-termination
            config:
              status_code: 200
              content_type: "text/html; charset=utf-8"
              body: "<p>Your local Tio recovery code: {{ .Token }}</p>"
